---
name: run_python_ci

on:
  push:
    paths:
      - .github/workflows/run_python_ci.yml
      - python/**

jobs:
  run_ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 0.8.19

      - name: Sync dependencies
        run: uv sync --frozen --dev
        working-directory: .devcontainer/python

      - name: Run ruff
        run: |
          source .venv/bin/activate
          which uv
          uv run ruff check ../../python/
        working-directory: .devcontainer/python
